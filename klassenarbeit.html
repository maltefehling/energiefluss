<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit für die Klassenarbeit – Energie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A44; --blue:#3B6FB6; --dblue:#1F4E79; --green:#2E9E5B; --heat:#E4572E; --marker:#FFD447;
  --paper:#FFFFFF; --grid:#DCE7F5; --muted:#5C6780; --line:#C9D3E3;
  --ok-bg:#E3F4EA; --bad-bg:#FDE8E2; --merk:#DDE8F5; --hilfe:#FDF6EA; --hilfe-rand:#FBD9A8; --lila:#6D4A9E;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Patrick Hand","Comic Sans MS",cursive;font-weight:400;font-size:2.4rem;line-height:1.1;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink)}
.card h2{font-family:"Patrick Hand",cursive;font-weight:400;font-size:1.75rem;margin:0 0 8px;line-height:1.15}
sub{font-size:.7em}
.hide{display:none!important}
.note{font-size:.93rem;color:var(--muted)}

/* Auswahl */
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.big{display:block;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;box-shadow:3px 3px 0 var(--ink);min-height:56px}
.big b{font-size:1.1rem;display:block}
.big small{color:var(--muted);display:block;line-height:1.35;margin-top:2px}
.big.sel{background:var(--marker)}
.big:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stars{color:#B8860B;letter-spacing:1px}

/* Fortschritt */
#prog{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px;padding:8px 0;border-bottom:2px solid var(--ink);position:sticky;top:0;background:rgba(255,255,255,.95);z-index:5}
#prog button{min-width:34px;height:34px;border-radius:999px;border:2px solid var(--line);background:#fff;font:800 13px "Nunito",sans-serif;color:var(--muted);cursor:pointer;padding:0 8px}
#prog button.cur{border-color:var(--ink);color:#fff;background:var(--ink)}
#prog button.ok{border-color:var(--green);color:var(--green)}
#prog button.teil{border-color:#B8860B;color:#B8860B}
#prog button.nein{border-color:var(--heat);color:var(--heat)}
#prog button.cur.ok,#prog button.cur.teil,#prog button.cur.nein{color:#fff}
#prog .info{margin-left:auto;font-weight:800;font-size:.9rem;color:var(--muted)}

/* Aufgabe */
.kopf{font:800 13px "Nunito",sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.chip{font:700 12px "Nunito",sans-serif;border:1.5px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.chip.k{border-color:#9DB9DE;color:var(--dblue)}
.material{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 14px;background:#FBFCFE}
.material .ml{font:800 13px "Nunito",sans-serif;color:var(--blue);margin-bottom:4px}
.material table,table.t{border-collapse:collapse;width:100%;margin-top:6px;font-size:.97rem}
.material th,table.t th{text-align:left;color:var(--dblue);font-weight:800;border-bottom:1.5px solid var(--dblue);padding:4px 8px}
.material td,table.t td{border-bottom:1px solid var(--line);padding:5px 8px}
.material td.n{text-align:right;white-space:nowrap;font-weight:700}
.ad{border:3px solid var(--heat);border-radius:12px;padding:12px 14px;text-align:center;background:#FFF5F0;transform:rotate(-1deg);max-width:470px;margin:6px auto}
.ad b{font-size:1.3rem;display:block;color:var(--heat)}
.teil{border-top:2px solid var(--line);padding-top:12px;margin-top:14px}
.teil:first-of-type{border-top:none;margin-top:0;padding-top:0}
.tl{font-weight:800;color:var(--dblue)}
.q{font-size:1.06rem;font-weight:700;margin:6px 0 10px}
.svgbox{text-align:center;margin:6px 0}
.svgbox svg,.opt.diag svg{width:100%;max-width:420px;height:auto}
.opt.diag>span:last-child{width:100%;text-align:center}

/* Eingaben */
.opts{display:grid;gap:8px}
.opts.diag{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;min-height:44px;user-select:none;-webkit-user-select:none}
.opt.diag{flex-direction:column;align-items:center}
.opt .box{width:22px;height:22px;border:2px solid var(--ink);border-radius:50%;flex:0 0 auto;margin-top:2px}
.opt.multi .box{border-radius:5px}
.opt.on{border-color:var(--ink);background:#FFFBEA}
.opt.on .box{background:var(--ink);box-shadow:inset 0 0 0 3px #fff}
.opt.right{border-color:var(--green)!important;background:var(--ok-bg)}
.opt.wrong{border-color:var(--heat)!important;background:var(--bad-bg)}
.rows{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.row .lab{flex:1 1 260px}
.row select{font:700 16px "Nunito",sans-serif;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-height:40px;max-width:100%}
.row input,.erg input{width:150px;font:800 19px "Nunito",sans-serif;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.row .u,.erg .u{font-weight:800}
.row.right{border-color:var(--green);background:var(--ok-bg)}
.row.wrong{border-color:var(--heat);background:var(--bad-bg)}
input:focus,textarea:focus,select:focus{outline:3px solid var(--marker);border-color:var(--ink)}
textarea{width:100%;min-height:96px;font:17px/1.45 "Nunito",sans-serif;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}

/* Fünf-Schritt */
.fuenf{background:var(--hilfe);border:2px solid var(--hilfe-rand);border-radius:12px;padding:10px 14px;margin:10px 0}
.fuenf b{color:#8A5A12}
.five{display:grid;gap:6px;margin:8px 0}
.st{display:grid;grid-template-columns:30px 112px 1fr;gap:8px;align-items:start}
.st .sn{width:28px;height:28px;border-radius:50%;background:var(--dblue);color:#fff;font:800 14px "Nunito",sans-serif;display:flex;align-items:center;justify-content:center;margin-top:4px}
.st .sl{font-weight:800;color:var(--dblue);margin-top:6px}
.st textarea{min-height:42px;height:42px;padding:6px 10px;font-size:16px}
.erg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}
.erg.right{border-color:var(--green);background:var(--ok-bg)}
.erg.wrong{border-color:var(--heat);background:var(--bad-bg)}
@media (max-width:560px){.st{grid-template-columns:30px 1fr}.st .sl{display:none}h1{font-size:2rem}}

/* Buttons + Rückmeldung */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--marker);color:var(--ink);font:800 16px "Nunito",sans-serif;padding:9px 18px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;box-shadow:none;font-weight:700}
.btn.sol{background:#fff;border-color:var(--dblue);color:var(--dblue);box-shadow:3px 3px 0 var(--dblue)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.fb{margin-top:10px;border-radius:10px;padding:8px 12px}
.fb.ok{background:var(--ok-bg);border:2px solid var(--green)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--heat)}
.ideal{margin-top:12px;background:#F2F2F2;border:2px solid #BFBFBF;border-radius:12px;padding:10px 14px}
.ideal h4{margin:0 0 6px;color:var(--dblue);font-size:1rem}
.ideal p{margin:4px 0}
.ideal ul{margin:4px 0;padding-left:1.2em}
.is{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0}
.is .k{font-weight:800;color:var(--dblue);white-space:nowrap}
.is .zw{grid-column:1/-1;font-weight:800;color:var(--lila);margin-top:4px}
.hin{color:#8A5A12;font-weight:700}
.rate{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rate span{font-weight:800}
.rate button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:700 15px "Nunito",sans-serif;cursor:pointer;min-height:40px;color:var(--ink)}
.rate button.on[data-r="ok"]{border-color:var(--green);background:var(--ok-bg)}
.rate button.on[data-r="teil"]{border-color:#B8860B;background:#FFF6D6}
.rate button.on[data-r="nein"]{border-color:var(--heat);background:var(--bad-bg)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}

/* Übersicht */
.sumrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}
.ampel{font-weight:800;border-radius:999px;padding:2px 12px;white-space:nowrap}
.ampel.g{background:var(--ok-bg);color:var(--green)}
.ampel.y{background:#FFF6D6;color:#8A6A00}
.ampel.r{background:var(--bad-bg);color:var(--heat)}
.ampel.o{background:#F2F2F2;color:var(--muted)}
.bar{height:16px;border-radius:999px;background:#EEF2F8;overflow:hidden;border:1.5px solid var(--line);margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.foot{margin-top:28px;font-size:.88rem;color:var(--muted)}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fit für die Klassenarbeit: Energie</h1>
  <p class="sub">Physik Klasse 8 · Rechnen im Fünf-Schritt und Aufgaben mit Material</p>
  <section id="view"></section>
  <p class="foot">Fehling · Fit für die Klassenarbeit: Energie · <a href="index.html">alle Energie-Apps</a></p>
</div>

<script>
"use strict";
/* ============ Hilfsfunktionen ============ */
const R=(a,b,s=1)=>+(a+s*Math.floor(Math.random()*(Math.floor((b-a)/s+1e-9)+1))).toFixed(6);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const g=9.81;
const rd=(x,d=2)=>Math.round(x*10**d)/10**d;
// deutsches Zahlformat: Komma, schmales Leerzeichen als Tausendertrenner
function f(x,d=2){const r=rd(x,d);let [i,fr]=Math.abs(r).toFixed(d).split('.');fr=(fr||'').replace(/0+$/,'');
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (r<0?'−':'')+i+(fr?','+fr:'');}
const E=s=>`E<sub>${s}</sub>`;
const eq=x=>Math.abs(x-rd(x))>1e-9?'≈':'=';
const ZU=E('zu'),NU=E('nutz'),EN=E('entw'),EP=E('pot');
function parseDE(s){s=String(s||'').trim().replace(/[\s ]/g,'').replace(/[−–]/g,'-').replace(/[^\d,.\-]/g,'');
  if(!s)return NaN; if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,''); s=s.replace(',','.'); return Number(s);}
const nah=(x,w)=>isFinite(x)&&Math.abs(x-w)<=Math.max(0.011,Math.abs(w)*0.005);
const KOMP={S:'Sachkompetenz',E:'Erkenntnisgewinnung',K:'Kommunikation',B:'Bewertung'};

/* ============ Grafiken ============ */
// Energieflussdiagramm: Breiten (bz, bn, bw) unabhängig von den Beschriftungen, damit auch „falsche“ Diagramme möglich sind
function sankey(o){
  const s=o.s||1, H=o.bz*s, hn=o.bn*s, hw=o.bw*s, y0=30, xJ=170;
  const yc=y0+hn+hw/2, Rr=26+hw/2, xd=xJ+30+Rr, yEnd=y0+H+70;
  const W=o.w||420, Ht=yEnd+64, bw2=Math.max(26,(o.dev||'').length*4.4+8);
  return `<svg viewBox="0 0 ${W} ${Ht}" width="${W}" role="img" aria-label="Energieflussdiagramm">
  <line x1="18" y1="${y0+H/2}" x2="${xJ}" y2="${y0+H/2}" stroke="#3B6FB6" stroke-width="${H}"/>
  <line x1="${xJ}" y1="${y0+hn/2}" x2="${xJ+150}" y2="${y0+hn/2}" stroke="#2E9E5B" stroke-width="${hn}"/>
  <polygon points="${xJ+150},${y0-9} ${xJ+150},${y0+hn+9} ${xJ+178},${y0+hn/2}" fill="#2E9E5B"/>
  <path d="M${xJ} ${yc} L${xJ+30} ${yc} A${Rr} ${Rr} 0 0 1 ${xd} ${yc+Rr} L${xd} ${yEnd}" fill="none" stroke="#E4572E" stroke-width="${hw}"/>
  <polygon points="${xd-hw/2-9},${yEnd} ${xd+hw/2+9},${yEnd} ${xd},${yEnd+24}" fill="#E4572E"/>
  <rect x="${xJ-bw2}" y="${y0-14}" width="${2*bw2}" height="${H+28}" rx="8" fill="#fff" stroke="#1F2A44" stroke-width="2"/>
  <text x="${xJ}" y="${y0+H/2+5}" text-anchor="middle" font-size="13" font-weight="800" fill="#1F2A44">${o.dev||''}</text>
  <text x="18" y="${y0+H+32}" font-size="13" font-weight="800" fill="#3B6FB6">${o.lz}</text>
  <text x="${xJ+44}" y="${y0-8}" font-size="14" font-weight="800" fill="#2E9E5B">${o.ln}</text>
  <text x="${xd+hw/2+14}" y="${yEnd+4}" font-size="14" font-weight="800" fill="#E4572E">${o.lw}</text>
  </svg>`;}
function halfpipe(){
  const P=[[60,40],[86,128],[220,186],[354,128],[380,40]];
  return `<svg viewBox="0 0 440 230" width="440" role="img" aria-label="Halfpipe mit den Punkten 1 bis 5">
  <path d="M40 30 L60 30 C60 210 380 210 380 30 L400 30" fill="none" stroke="#1F2A44" stroke-width="5" stroke-linecap="round"/>
  ${P.map((p,i)=>`<circle cx="${p[0]+(i<2?14:i>2?-14:0)}" cy="${p[1]-(i==2?14:6)}" r="13" fill="#FFD447" stroke="#1F2A44" stroke-width="2"/><text x="${p[0]+(i<2?14:i>2?-14:0)}" y="${p[1]-(i==2?14:6)+5}" text-anchor="middle" font-weight="800" font-size="15">${i+1}</text>`).join('')}
  <text x="220" y="222" text-anchor="middle" font-size="13" fill="#5C6780">Der Skater startet an Punkt 1 aus dem Stand. Reibung kannst du vernachlässigen.</text></svg>`;}

/* ============ Aufgabentypen ============
 mc:      opts[], richtig (Index) oder richtig:[…] mit multi:true
 select:  rows:[{l, opts[], r}]
 zahl:    rows:[{l, w, u}]
 offen:   ideal, krit[]
 rechnen: text, frage, geg[], ges, schritte:[{t?, formel, rechnung[]}], antwort, erg:{w,u,l}, hin
 einheit: material, teile[] (IQB-Aufgabe mit Material)                      */

const opt8=['kinetische Energie (Bewegungsenergie)','potenzielle Energie (Lageenergie)','Spannenergie','thermische Energie (Wärmeenergie)','elektrische Energie','chemische Energie','Strahlungsenergie (Licht)','Kernenergie'];
const optU=['elektrische Energie','chemische Energie','kinetische Energie','potenzielle Energie','thermische Energie (Wärme)','Strahlungsenergie (Licht)','Spannenergie'];
const RE=o=>({typ:'rechnen',punkte:o.punkte||3,...o});

/* ---------- Rechenaufgaben: Wirkungsgrad (6) ---------- */
const GER6=[
 {n:'Ein Elektromotor',er:'er',gen:'des Elektromotors',zu:'elektrische Energie',nutz:'Bewegungsenergie',min:70,max:90},
 {n:'Eine Bohrmaschine',er:'sie',gen:'der Bohrmaschine',zu:'elektrische Energie',nutz:'Bewegungsenergie',min:60,max:80},
 {n:'Ein Automotor',er:'er',gen:'des Automotors',zu:'chemische Energie aus Benzin',nutz:'Bewegungsenergie',min:20,max:35},
 {n:'Eine LED-Lampe',er:'sie',gen:'der LED-Lampe',zu:'elektrische Energie',nutz:'Licht',min:30,max:45},
 {n:'Ein Wasserkocher',er:'er',gen:'des Wasserkochers',zu:'elektrische Energie',nutz:'thermische Energie des Wassers',min:85,max:95}];
function w6a(){const d=pick(GER6),Z=R(2,10)*100,eta=R(d.min,d.max,5),N=Z*eta/100;
 return RE({titel:'Wirkungsgrad berechnen',text:`${d.n} bekommt die zugeführte Energie <b>${ZU} = ${f(Z)} J</b> (${d.zu}). Davon wandelt ${d.er} die Nutzenergie <b>${NU} = ${f(N)} J</b> in ${d.nutz} um.`,
 frage:`Berechne den Wirkungsgrad <b>η</b> ${d.gen}.`,geg:[`${ZU} = ${f(Z)} J`,`${NU} = ${f(N)} J`],ges:'η in %',
 schritte:[{formel:`η = ${NU} : ${ZU}`,rechnung:[`η = ${f(N)} J : ${f(Z)} J`,`η = ${f(eta/100)} = ${f(eta)} %`]}],
 antwort:`Der Wirkungsgrad ${d.gen} beträgt η = ${f(eta)} %.`,erg:{w:eta,u:'%',l:'η'}});}
function w6b(){const d=pick([{n:'Ein Ladegerät',nutz:'chemische Energie im Akku'},{n:'Ein Elektromotor',nutz:'Bewegungsenergie'},{n:'Ein Solarmodul-Wechselrichter',nutz:'elektrische Energie fürs Hausnetz'}]);
 const eta=pick([60,70,75,80,85,90]),Z=R(2,10)*100,N=Z*eta/100;
 return RE({titel:'Formel umstellen: Nutzenergie',text:`${d.n} hat den Wirkungsgrad <b>η = ${eta} %</b> und bekommt die zugeführte Energie <b>${ZU} = ${f(Z)} J</b>. Die Nutzenergie ist ${d.nutz}.`,
 frage:`Berechne die Nutzenergie <b>${NU}</b>.`,geg:[`η = ${eta} % = ${f(eta/100)}`,`${ZU} = ${f(Z)} J`],ges:`${NU} in J`,
 schritte:[{formel:`${NU} = η · ${ZU}`,rechnung:[`${NU} = ${f(eta/100)} · ${f(Z)} J`,`${NU} = ${f(N)} J`]}],
 antwort:`Die Nutzenergie beträgt ${NU} = ${f(N)} J.`,erg:{w:N,u:'J',l:NU},hin:'Prozent zum Rechnen als Dezimalzahl: '+eta+' % = '+f(eta/100)+'.'});}
function w6c(){const d=pick([{n:'Ein Akkuschrauber',zu:'elektrische Energie',nutz:'Bewegungsenergie',min:60,max:80,gen:'des Akkuschraubers'},{n:'Ein Rasenmäher mit Benzinmotor',zu:'chemische Energie',nutz:'Bewegungsenergie',min:20,max:30,gen:'des Rasenmähers'},{n:'Ein Mixer',zu:'elektrische Energie',nutz:'Bewegungsenergie',min:50,max:70,gen:'des Mixers'}]);
 const Z=R(12,60)*100,eta=R(d.min,d.max,5),N=Z*eta/100;
 return RE({titel:'Wirkungsgrad mit Umrechnen',text:`${d.n} nimmt ${f(Z/1000,3)} kJ ${d.zu} auf und gibt davon ${f(N)} J als ${d.nutz} ab.`,
 frage:'Wie groß ist der Wirkungsgrad?',geg:[`${ZU} = ${f(Z/1000,3)} kJ = ${f(Z)} J`,`${NU} = ${f(N)} J`],ges:'η in %',
 schritte:[{formel:`η = ${NU} : ${ZU}`,rechnung:[`η = ${f(N)} J : ${f(Z)} J`,`η = ${f(eta/100)} = ${f(eta)} %`]}],
 antwort:`Der Wirkungsgrad ${d.gen} beträgt η = ${f(eta)} %.`,erg:{w:eta,u:'%',l:'η'},hin:'Erst kJ in J umrechnen: 1 kJ = 1 000 J.'});}
function w6d(){const Zk=R(2,9)*1000,eta=pick([80,90,95]),Nk=Zk*eta/100;
 return RE({titel:'Formel umstellen: zugeführte Energie',text:`Eine Überlandleitung hat einen Wirkungsgrad von ${eta} %. Bei den Häusern kommen ${f(Nk)} kJ elektrische Energie an.`,
 frage:'Wie viel elektrische Energie muss das Kraftwerk in die Leitung einspeisen? Gib das Ergebnis in J an.',geg:[`η = ${eta} % = ${f(eta/100)}`,`${NU} = ${f(Nk)} kJ = ${f(Nk*1000)} J`],ges:`${ZU} in J`,

 return RE({titel:'Kran: Energie und Leistung',punkte:5,text:`Ein 45 m hoher Baukran hebt eine ${f(t)} t schwere Last in ${s} s um ${h} m nach oben.`,
 frage:'Welche Leistung muss der Kran dafür mindestens haben?',geg:[`m = ${f(t)} t = ${f(t*1000)} kg`,`h = ${h} m`,`t = ${s} s`,'g = 9,81 N/kg'],ges:'P in W',
 schritte:[{t:'Zwischenschritt: potenzielle Energie der Last',formel:`${EP} = m · g · h`,rechnung:[`${EP} = ${f(t*1000)} kg · 9,81 N/kg · ${h} m = ${f(Ep)} J`]},
  {t:'Leistung',formel:`P = E : t`,rechnung:[`P = ${f(Ep)} J : ${s} s`,`P ${eq(P)} ${f(P)} W`]}],
 antwort:`Der Kran braucht mindestens eine Leistung von P = ${f(P)} W.`,erg:{w:rd(P),u:'W',l:'P'},hin:'Die Höhe des Krans (45 m) ist nicht die Hubhöhe – du brauchst sie nicht.'});}
function l8h(){const P=pick([500,600,750,800]),gm=R(30,60)*1000,s=R(15,30),Ej=P*s,h=Ej/(gm/1000*g);
 return RE({titel:'Motor hebt Zement: Wie hoch?',punkte:5,text:`Ein ${P}-Watt-Motor hebt einen Sack Zement (${f(gm)} g) in ${s} Sekunden an. Nimm an, dass die ganze Energie in potenzielle Energie umgewandelt wird.`,
 frage:'Berechne, wie hoch der Sack gehoben wird.',geg:[`P = ${P} W`,`m = ${f(gm)} g = ${f(gm/1000)} kg`,`t = ${s} s`,'g = 9,81 N/kg'],ges:'h in m',
 schritte:[{t:'Zwischenschritt: umgewandelte Energie',formel:'E = P · t',rechnung:[`E = ${P} W · ${s} s = ${f(Ej)} J`]},
  {t:'Höhe',formel:`h = ${EP} : (m · g)`,rechnung:[`h = ${f(Ej)} J : (${f(gm/1000)} kg · 9,81 N/kg)`,`h ${eq(h)} ${f(h)} m`]}],
 antwort:`Der Sack wird etwa h = ${f(h)} m hoch gehoben.`,erg:{w:rd(h),u:'m',l:'h'}});}
function l8i(){const Pk=pick([1.8,2,2.2]),mi=pick([2,3,4]),eta=pick([80,85,90]),Z=Pk*1000*mi*60,N=Z*eta/100;
 return RE({titel:'Wasserkocher: Leistung und Wirkungsgrad',punkte:5,text:`Ein Wasserkocher (${f(Pk)} kW) mit 1 Liter Wasser ist ${mi} Minuten lang eingeschaltet. Sein Wirkungsgrad beträgt ${eta} %.`,
 frage:'Wie viel Energie bekommt das Wasser? Gib das Ergebnis in J an.',geg:[`P = ${f(Pk)} kW = ${f(Pk*1000)} W`,`t = ${mi} min = ${mi*60} s`,`η = ${eta} % = ${f(eta/100)}`],ges:`${NU} in J`,
 schritte:[{t:'Zwischenschritt: zugeführte elektrische Energie',formel:`${ZU} = P · t`,rechnung:[`${ZU} = ${f(Pk*1000)} W · ${mi*60} s = ${f(Z)} J`]},
  {t:'Nutzenergie',formel:`${NU} = η · ${ZU}`,rechnung:[`${NU} = ${f(eta/100)} · ${f(Z)} J`,`${NU} = ${f(N)} J`]}],
 antwort:`Das Wasser bekommt ${NU} = ${f(N)} J.`,erg:{w:N,u:'J',l:NU},hin:'Die Wassermenge (1 Liter) brauchst du nicht.'});}

function iqb(key,n){const u=IQB[key];const teile=u.teile.filter(t=>t.niv.includes(n));

const FUENF='<div class="fuenf">✎ <b>Denk an den Fünf-Schritt!</b> ① gegeben (Formelzeichen = Wert mit Einheit) · ② gesucht (<b>Formelzeichen und Einheit</b>) · ③ Formel · ④ Rechnung (mit Formelzeichen und Einheiten) · ⑤ Antwortsatz (mit Formelzeichen, Zahl und Einheit)</div>';

function startView(){S.mode=null;S.ber=null;S.niv=null;
 V.innerHTML=`<div class="card"><h2>Was willst du üben?</h2><div class="choice">
  <button class="big" data-m="ka"><b>Ganze Klassenarbeit</b><small>Aus jedem Bereich eine Aufgabe – wie in der echten Klassenarbeit, mit Punkten.</small></button>
  <button class="big" data-m="ber"><b>Einen Bereich</b><small>Alle Aufgaben zu einer Seite aus deinem OneNote-Heft.</small></button></div></div>
  <div class="card"><h2>So funktioniert's</h2><ul>
  <li>Bei Rechenaufgaben schreibst du den <b>Fünf-Schritt</b> in die Felder oder ins Heft. Dein Ergebnis kannst du prüfen lassen.</li>
  <li>Nach jeder Aufgabe kannst du dir die <b>Ideallösung</b> anzeigen lassen. Vergleiche ehrlich und gib an, wie es lief.</li>
  <li>Aufgaben mit <b>Material</b> (Text, Tabelle, Diagramm) sind wie die Vergleichsaufgaben des IQB: Lies zuerst genau das Material.</li>
  <li>Rechenaufgaben bekommen bei jedem Durchgang <b>neue Zahlen</b>.</li></ul></div>`;
 V.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.mode==='ka'?nivView():berView();});scrollTo(0,0);}
function berView(){V.innerHTML=`<div class="card"><h2>Welchen Bereich?</h2><p class="note">Die Bereiche heißen wie die Seiten in deinem OneNote-Heft.</p><div class="choice">${BER.map(b=>`<button class="big" data-b="${b.nr}"><b>${b.name}</b>${b.info?`<small>${b.info}</small>`:''}</button>`).join('')}</div>
 <div class="actions"><button class="btn ghost" id="back">← zurück</button></div></div>`;
 V.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.ber=+b.dataset.b;BER[S.ber].one?(S.niv=1,go()):nivView();});document.getElementById('back').onclick=startView;scrollTo(0,0);}
function nivView(){V.innerHTML=`<div class="card"><h2>${S.mode==='ka'?'Ganze Klassenarbeit':BER[S.ber].name}: Welches Niveau?</h2><div class="choice">${[1,2,3].map(n=>`<button class="big" data-n="${n}"><b><span class="stars">${NIV[n][0]}</span> ${NIV[n][1]}</b><small>${NIV[n][2]}</small></button>`).join('')}</div>
 <div class="actions"><button class="btn ghost" id="back">← zurück</button></div></div>`;
 V.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.niv=+b.dataset.n;go();});document.getElementById('back').onclick=()=>S.mode==='ka'?startView():berView();scrollTo(0,0);}
function go(){S.list=S.mode==='ka'?klassenarbeit(S.niv):BER[S.ber].tasks(S.niv).map(t=>({...t,bereich:S.ber}));S.i=0;S.res={};taskView();}

/* ---------- Teilaufgabe rendern ---------- */
function subHTML(t,k,lab){
 let h=`<div class="teil" id="s${k}">${lab?`<div class="tl">${lab}</div>`:''}`;
 if(t.k)h+=`<div class="chips"><span class="chip k">${KOMP[t.k]}</span><span class="chip">Anforderungsbereich ${t.afb}</span></div>`;
 if(t.svg)h+=`<div class="svgbox">${t.svg}</div>`;
 if(t.typ==='rechnen'){h+=`<p>${t.text}</p><p class="q">${t.frage}</p>${FUENF}<div class="five">${['gegeben','gesucht','Formel','Rechnung','Antwort'].map((s,i)=>`<div class="st"><div class="sn">${'①②③④⑤'[i]}</div><div class="sl">${s}</div><textarea aria-label="${s}" placeholder="${i===1?'Formelzeichen und Einheit':''}"></textarea></div>`).join('')}</div>
  <div class="erg"><span>Dein Ergebnis zum Prüfen: <b>${t.erg.l} =</b></span><input inputmode="decimal" autocomplete="off"><span class="u">${t.erg.u}</span></div>`;}
 else{h+=`<p class="q">${t.frage}</p>`;
  if(t.typ==='mc')h+=`<div class="opts ${t.diag?'diag':''}">${t.opts.map((o,i)=>`<div class="opt ${t.multi?'multi':''} ${t.diag?'diag':''}" data-i="${i}" role="button" tabindex="0">${t.diag?`<b>${'ABCD'[i]}</b>`:''}<span class="box"></span><span>${o}</span></div>`).join('')}</div>${t.multi?'<p class="note">Mehrere Antworten können richtig sein.</p>':''}`;
  if(t.typ==='select')h+=`<div class="rows">${t.rows.map(r=>`<div class="row"><span class="lab">${r.l}</span><select><option value="">– wählen –</option>${r.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}</div>`;
  if(t.typ==='zahl')h+=`<div class="rows">${t.rows.map(r=>`<div class="row"><span class="lab">${r.l}</span><input inputmode="decimal" autocomplete="off"><span class="u">${r.u}</span></div>`).join('')}</div>`;
  if(t.typ==='offen')h+=`<textarea placeholder="Deine Antwort (oder schreib sie ins Heft)"></textarea>`;}
 const auto=t.typ!=='offen';
 h+=`<div class="actions">${auto?'<button class="btn" data-a="check">Prüfen</button>':''}<button class="btn sol" data-a="ideal">Ideallösung anzeigen</button></div><div class="fbx"></div><div class="ideal hide">${idealHTML(t)}</div>
  <div class="rate hide"><span>Wie lief's?</span><button data-r="ok">✓ richtig</button><button data-r="teil">◐ teilweise</button><button data-r="nein">✗ noch nicht</button></div></div>`;
 return h;}
function idealHTML(t){
 if(t.typ==='rechnen'){let h=`<h4>Ideallösung im Fünf-Schritt</h4><div class="is"><span class="k">① gegeben:</span><span>${t.geg.join('<br>')}</span><span class="k">② gesucht:</span><span>${t.ges}</span>`;
  const multi=t.schritte.length>1;
  t.schritte.forEach(s=>{if(multi)h+=`<span class="zw">${s.t}</span>`;h+=`<span class="k">③ Formel:</span><span>${s.formel}</span><span class="k">④ Rechnung:</span><span>${s.rechnung.join('<br>')}</span>`;});
  h+=`<span class="k">⑤ Antwort:</span><span>${t.antwort}</span></div>`;if(t.hin)h+=`<p class="hin">Tipp: ${t.hin}</p>`;return h;}
 if(t.typ==='mc'){const r=[].concat(t.richtig);return `<h4>Ideallösung</h4>${t.diag?`<p>Richtig ist <b>${r.map(i=>'ABCD'[i]).join(', ')}</b>.</p>`:`<ul>${r.map(i=>`<li><b>${t.opts[i]}</b></li>`).join('')}</ul>`}${t.erkl?`<p>${t.erkl}</p>`:''}`;}
 if(t.typ==='select')return `<h4>Ideallösung</h4><table class="t">${t.rows.map(r=>`<tr><td>${r.l}</td><td><b>${r.r}</b></td></tr>`).join('')}</table>${t.erkl?`<p>${t.erkl}</p>`:''}`;
 if(t.typ==='zahl')return `<h4>Ideallösung</h4>${t.rows.map(r=>`<p>${r.l} <b>${f(r.w)} ${r.u}</b></p>`).join('')}${t.erkl?`<p>${t.erkl}</p>`:''}`;
 if(t.typ==='offen')return `<h4>Ideallösung</h4><p>${t.ideal}</p>${t.krit?`<p class="note" style="color:var(--ink)"><b>Daran erkennst du eine gute Antwort:</b></p><ul>${t.krit.map(k=>`<li>${k}</li>`).join('')}</ul>`:''}`;}
function check(t,el){
 if(t.typ==='mc'){const on=[...el.querySelectorAll('.opt')].map((o,i)=>o.classList.contains('on')?i:-1).filter(i=>i>=0);if(!on.length)return null;const r=[].concat(t.richtig);
  el.querySelectorAll('.opt').forEach((o,i)=>{o.classList.remove('right','wrong');if(o.classList.contains('on'))o.classList.add(r.includes(i)?'right':'wrong');});
  return on.length===r.length&&on.every(i=>r.includes(i));}
 if(t.typ==='select'){const s=[...el.querySelectorAll('select')];if(s.every(x=>!x.value))return null;let ok=true;
  s.forEach((x,i)=>{const row=x.closest('.row');row.classList.remove('right','wrong');const good=x.value===t.rows[i].r;if(x.value)row.classList.add(good?'right':'wrong');if(!good)ok=false;});return ok;}
 if(t.typ==='zahl'){const s=[...el.querySelectorAll('.row input')];if(s.every(x=>!x.value.trim()))return null;let ok=true;
  s.forEach((x,i)=>{const row=x.closest('.row');row.classList.remove('right','wrong');const v=parseDE(x.value),w=t.rows[i].w;const good=nah(v,w)||(t.rows[i].u==='%'&&nah(v*100,w));if(x.value.trim())row.classList.add(good?'right':'wrong');if(!good)ok=false;});return ok;}
 if(t.typ==='rechnen'){const x=el.querySelector('.erg input'),box=el.querySelector('.erg');if(!x.value.trim())return null;const v=parseDE(x.value),w=t.erg.w;
  const good=nah(v,w)||(t.erg.u==='%'&&nah(v*100,w));box.classList.remove('right','wrong');box.classList.add(good?'right':'wrong');return good;}
 return null;}
function bindSub(t,el,key){
 if(t.typ==='mc')el.querySelectorAll('.opt').forEach(o=>{const tog=()=>{if(!t.multi)el.querySelectorAll('.opt').forEach(p=>p!==o&&p.classList.remove('on'));o.classList.toggle('on');};o.onclick=tog;o.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog();}};});
 const fbx=el.querySelector('.fbx'),rate=el.querySelector('.rate'),ideal=el.querySelector('.ideal');
 const setR=r=>{S.res[key]=r;rate.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));progress();};
 rate.querySelectorAll('button').forEach(b=>b.onclick=()=>setR(b.dataset.r));
 const c=el.querySelector('[data-a="check"]');
 if(c)c.onclick=()=>{const r=check(t,el);if(r===null){fbx.innerHTML='<div class="fb bad">Gib zuerst eine Antwort ein.</div>';return;}
  fbx.innerHTML=r?'<div class="fb ok"><b>Richtig!</b> '+(t.typ==='rechnen'?'Vergleiche jetzt deinen Fünf-Schritt mit der Ideallösung.':'')+'</div>':'<div class="fb bad"><b>Noch nicht ganz.</b> Überprüfe die rot markierten Stellen'+(t.typ==='rechnen'?' – Einheiten umgerechnet? Richtige Formel?':'')+' – oder schau dir die Ideallösung an.</div>';
  rate.classList.remove('hide');if(r&&!S.res[key])setR('ok');};
 el.querySelector('[data-a="ideal"]').onclick=()=>{ideal.classList.toggle('hide');rate.classList.remove('hide');el.querySelector('[data-a="ideal"]').textContent=ideal.classList.contains('hide')?'Ideallösung anzeigen':'Ideallösung ausblenden';};
 if(S.res[key])setR(S.res[key]),rate.classList.remove('hide');}

function subs(t){return t.typ==='einheit'?t.teile:[t];}
function taskView(){const t=S.list[S.i],b=BER[t.bereich];
 let h=`<div id="prog"></div><div class="card"><div class="kopf"><span>Aufgabe ${S.i+1} von ${S.list.length} · ${b.name}</span><span class="stars">${NIV[S.niv][0]}</span></div><h2>${t.typ==='einheit'?'Aufgabe mit Material: ':''}${t.titel}</h2>`;
 if(t.typ==='einheit')h+=`<div class="material">${t.material}</div>`+t.teile.map((x,j)=>subHTML(x,S.i+'_'+j,'abcdef'[j]+')')).join('');
 else h+=subHTML(t,S.i+'_0');
 h+=`<div class="nav"><button class="btn ghost" id="prev" ${S.i?'':'disabled'}>← zurück</button><button class="btn" id="next">${S.i<S.list.length-1?'weiter →':'zur Auswertung'}</button></div></div>`;
 V.innerHTML=h;subs(t).forEach((x,j)=>bindSub(x,document.getElementById('s'+S.i+'_'+j),S.i+'_'+j));
 document.getElementById('prev').onclick=()=>{S.i--;taskView();};document.getElementById('next').onclick=()=>{if(S.i<S.list.length-1){S.i++;taskView();}else sumView();};
 progress();scrollTo(0,0);}
function stat(i){const t=S.list[i],ss=subs(t);let p=0,max=0,done=0;
 ss.forEach((x,j)=>{const pk=x.punkte||(x.typ==='select'||x.typ==='zahl'?Math.max(1,x.rows.length*.5):x.typ==='offen'?2:x.typ==='rechnen'?3:1);max+=pk;const r=S.res[i+'_'+j];if(r)done++;p+=r==='ok'?pk:r==='teil'?pk/2:0;});
 return {p,max,done,all:ss.length};}
function progress(){const el=document.getElementById('prog');if(!el)return;let tp=0,tm=0;
 el.innerHTML=S.list.map((t,i)=>{const s=stat(i);tp+=s.p;tm+=s.max;const c=s.done<s.all?'':s.p>=s.max?'ok':s.p>0?'teil':'nein';return `<button class="${i===S.i?'cur ':''}${c}" data-i="${i}" aria-label="Aufgabe ${i+1}">${i+1}</button>`;}).join('')+(S.mode==='ka'?`<span class="info">${f(tp,1)} / ${f(tm,1)} P.</span>`:'');
 el.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.i;taskView();});}
function sumView(){let tp=0,tm=0;const per={};
 S.list.forEach((t,i)=>{const s=stat(i);tp+=s.p;tm+=s.max;const k=t.bereich;per[k]=per[k]||{p:0,max:0,done:0,all:0};per[k].p+=s.p;per[k].max+=s.max;per[k].done+=s.done;per[k].all+=s.all;});
 const pc=tm?tp/tm*100:0;
 V.innerHTML=`<div class="card"><h2>Auswertung: ${S.mode==='ka'?'Klassenarbeit':BER[S.ber].name} <span class="stars">${NIV[S.niv][0]}</span></h2>
 <p><b>${f(tp,1)} von ${f(tm,1)} Punkten</b> (${f(pc,0)} %) – nach deiner eigenen Einschätzung.</p><div class="bar"><i style="width:${pc}%"></i></div>
 ${Object.keys(per).sort((a,b)=>a-b).map(k=>{const q=per[k],r=q.max?q.p/q.max:0,cls=q.done<q.all?'o':r>=.8?'g':r>=.5?'y':'r',txt=q.done<q.all?'nicht bewertet':r>=.8?'sicher':r>=.5?'fast':'noch üben';
  return `<div class="sumrow"><span><b>${BER[k].name}</b>${cls==='r'||cls==='y'?`<br><span class="note">Schlag im OneNote-Heft die Seite „${BER[k].name}“ auf${k==0?' (Merkkästen zum Fünf-Schritt und zu den Einheiten)':''}.</span>`:''}</span><span class="ampel ${cls}">${txt}</span></div>`;}).join('')}
 <p class="note">Übertrage dein Ergebnis in dein Kompetenzraster: sicher · fast · noch üben.</p>
 <div class="actions"><button class="btn" id="again">Nochmal mit neuen Zahlen</button><button class="btn ghost" id="other">Anderes Niveau</button><button class="btn ghost" id="home">Zum Start</button></div></div>`;
 document.getElementById('again').onclick=go;document.getElementById('other').onclick=nivView;document.getElementById('home').onclick=startView;scrollTo(0,0);}
startView();
</script>
</body>
</html>
